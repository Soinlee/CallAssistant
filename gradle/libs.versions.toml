# Version catalog for CallerInfo
# Centralizes all dependency versions, libraries, and plugin versions.

[versions]
# ---- Build plugins ----
agp = "9.3.2"
kotlin = "2.2.10"
googleServices = "4.4.2"

# ---- SDK / App metadata ----
compileSdk = "35"
targetSdk = "35"
minSdk = "29"
pluginId = "com.github.soinlee.callassistant.plugin"
pluginVersionName = "1.1.8"
pluginVersionCode = "12"

# ---- AndroidX (app primary versions) ----
coreKtx = "1.15.0"
appcompat = "1.7.0"
annotation = "1.7.0"
cardview = "1.0.0"
constraintlayout = "2.1.4"
browser = "1.7.0"
work = "2.9.1"
multidex = "2.0.1"
legacySupportV4 = "1.0.0"
material = "1.12.0"
coroutines = "1.10.1"
activity = "1.9.3"
lifecycle = "2.8.7"

# ---- Google / third-party (app) ----
guava = "33.4.0-android"
flexbox = "3.0.0"
circleImageView = "3.1.0"
dagger = "2.55"
firebase = "21.6.1"
bugly = "3.1.0"
materialDialog = "0.9.6.0"
requery = "1.5.1"
jsr305annotations = "1.3.2"
appauth = "0.11.1"
stetho = "1.6.0"
apmemLayouts = "1.10"

# ---- Testing (app) ----
junit = "4.13.2"
mockito = "4.11.0"
extJunit = "1.2.1"
uiautomator = "2.3.0"
testRules = "1.5.0"
espresso = "3.6.1"
hamcrest = "2.2"
truth = "1.0.1"

# ---- phone-number / config module versions ----
gson = "2.8.6"
libphonenumber = "8.12.0"
geocoder = "2.136"
carrier = "1.126"
rxjava = "2.2.11"
rxandroid = "2.1.1"
minio = "6.0.13"
# reference only (top-level ext) that app does not consume directly
gsonReference = "2.10.1"

# ---- module specific test/legacy versions ----
junitModule = "4.13"
mockitoModule = "2.28.2"
extJunitModule = "1.1.1"
uiautomatorModule = "2.2.0"
testRulesModule = "1.2.0"
espressoModule = "3.2.0"
annotationModule = "1.1.0"
truthLibrary = "1.0.1"
testRunner = "1.2.0"
