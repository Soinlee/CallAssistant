def signingProperties = "signing.properties"
def signingKeys = [
        storeFile    : { x -> rootProject.file(x) },
        storePassword: { x -> x },
        keyAlias     : { x -> x },
        keyPassword  : { x -> x },
]

// Find signing.properties in project root, or in $HOME/.gradle
def f = ["${rootDir}/${signingProperties}", "${gradle.gradleUserHomeDir}/${signingProperties}"].find {
    file(it).exists()
}

if (f) {
    logger.info "Loading signing properties from ${f}"
    def props = new Properties()
    props.load(new FileInputStream(f))

    // For each property apply it to the release signing config
    signingKeys.any { k, fn ->
        if (!props.containsKey(k)) {
            logger.error "Missing property ${k}"
            android.buildTypes.release.signingConfig = null
            return true
        }
        android.signingConfigs.release[k] = fn(props[k])
        logger.info "Setting property ${k}"
    }
} else {
    // No signing.properties. Fall back to a release.jks in the project root + env vars, but
    // only if the keystore file actually exists. Otherwise leave the release signing config
    // unset so the build does not fail with an ENOENT on a missing keystore.
    def releaseJks = rootProject.file("release.jks")
    if (releaseJks.exists() && System.env.KEYSTORE_PASSWORD != null && System.env.ALIAS != null) {
        logger.info "Configuring release signing from release.jks + environment"
        android.signingConfigs.release["storeFile"] = releaseJks
        android.signingConfigs.release["storePassword"] = "${System.env.KEYSTORE_PASSWORD}"
        android.signingConfigs.release["keyAlias"] = "${System.env.ALIAS}"
        android.signingConfigs.release["keyPassword"] = "${System.env.ALIAS_PASSWORD}"
    } else {
        logger.warn "No signing configuration found. Release buildTypes will not be signed."
    }
}
