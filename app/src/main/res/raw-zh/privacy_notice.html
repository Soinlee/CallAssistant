<h3>隐私权声明</h3>
<div>
<p>
<b>本应用完全离线，不联网。</b>
本应用不会连接互联网，也不会向任何服务器收集、上传或传输您的任何个人数据。
</p>
<p>
所有功能均在设备本地完成：
</p>
<p>
&bull; <b>无任何网络请求：</b>本应用未声明联网权限，也从不发起任何网络连接。</p>
<p>
&bull; <b>仅本地数据：</b>通话记录、号码标记、设置等所有数据均仅在本机保存与处理，不会上传。</p>
<p>
&bull; <b>无账号、无追踪：</b>无需注册，不含统计、广告等任何第三方 SDK。</p>
<p>
<b>权限</b>仅用于您开启的本地功能，例如读取当前来电号码、显示来电信息悬浮窗等，这些数据不会离开您的设备。
</p>
</div>
